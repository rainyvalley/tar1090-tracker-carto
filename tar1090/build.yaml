---
# Alpine 3.24 is the current stable branch and what Home Assistant publishes
# for its supported (64-bit) architectures. The 32-bit bases are frozen at 3.22
# upstream: ghcr.io/home-assistant/armhf-base:3.23+ and -armv7-/-i386- do not
# exist, so those arches stay on the last image Home Assistant built for them.
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base:3.24"
  amd64: "ghcr.io/home-assistant/amd64-base:3.24"
  armhf: "ghcr.io/home-assistant/armhf-base:3.22"
  armv7: "ghcr.io/home-assistant/armv7-base:3.22"
  i386: "ghcr.io/home-assistant/i386-base:3.22"
labels:
  org.opencontainers.image.title: "Tar1090 Aircraft Tracker"
  org.opencontainers.image.description: "Displays aircraft from tar1090 on an interactive map"
  org.opencontainers.image.source: "https://github.com/rainyvalley/tar1090-tracker-carto"
  org.opencontainers.image.licenses: "BSD-2-Clause"
args: {}
