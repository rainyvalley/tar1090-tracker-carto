<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tar1090 Aircraft Tracker</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
        <h1>Aircraft Tracker</h1>
        <div id="stats">
            <span id="aircraft-count">0 aircraft</span>
            <span id="last-update">Last update: --</span>
            <span id="connection-status" class="status-disconnected">Disconnected</span>
        </div>
    </div>
    
    <div id="controls">
        <button id="toggle-history" type="button" aria-pressed="false" title="Show the path each aircraft has flown">Trails: Off</button>
        <button id="center-map">Center Map</button>
        <button id="toggle-list" aria-expanded="false" aria-controls="aircraft-list">Show Aircraft List</button>
        <select id="map-layer">
            <option value="carto_light">Carto Light</option>
            <option value="carto_dark">Carto Dark</option>
            <option value="carto_voyager">Carto Voyager</option>
            <option value="esri_satellite">Satellite</option>
        </select>
    </div>
    
    <div id="content">
        <div id="map"></div>

        <div id="aircraft-list" class="is-hidden" aria-hidden="true">
            <div id="aircraft-list-header">
                <h3>Aircraft List</h3>
                <button id="close-list" type="button" aria-label="Close aircraft list">&times;</button>
            </div>
            <div id="aircraft-items"></div>
        </div>
    </div>
    
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/maplibre/maplibre-gl.js"></script>
    <script src="vendor/maplibre/leaflet-maplibre-gl.js"></script>
    <script src="script.js"></script>
</body>
</html>
