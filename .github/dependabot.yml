# Keep the tar1090/Dockerfile base image and the Actions SHAs current; a
# weekly pass opens one PR per update.
version: 2
updates:
  # Base image pinned by tar1090/Dockerfile.
  - package-ecosystem: docker
    directory: "/tar1090"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
